<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToDo List — Список задач</title>
  <meta name="description" content="Современный и удобный список задач на чистом HTML, CSS и JavaScript" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background-decorations" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <main class="app-container">
    <header class="app-header">
      <div class="header-icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
      </div>
      <div>
        <h1 class="app-title">Мои задачи</h1>
        <p class="app-subtitle" id="task-counter">Всего задач: 0</p>
      </div>
    </header>

    <!-- Форма ввода новой задачи -->
    <form id="todo-form" class="todo-form" autocomplete="off">
      <div class="input-wrapper">
        <input
          type="text"
          id="todo-input"
          class="todo-input"
          placeholder="Что необходимо сделать?.."
          maxlength="120"
          aria-label="Текст новой задачи"
        />
        <button type="submit" id="add-btn" class="add-btn" aria-label="Добавить задачу">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Добавить</span>
        </button>
      </div>
    </form>

    <!-- Список задач -->
    <section class="tasks-section" aria-label="Список задач">
      <ul id="todo-list" class="todo-list"></ul>

      <!-- Сообщение-заглушка для пустого списка -->
      <div id="empty-state" class="empty-state" role="status">
        <div class="empty-icon" aria-hidden="true">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <path d="m9 16 2 2 4-4"></path>
          </svg>
        </div>
        <p class="empty-title">Список задач пустой</p>
        <p class="empty-desc">Добавьте новую задачу выше, чтобы начать свой день продуктивно!</p>
      </div>
    </section>

    <!-- Подвал карточки со статистикой -->
    <footer id="app-footer" class="app-footer hidden">
      <span id="remaining-count" class="remaining-count">0 осталось</span>
      <button type="button" id="clear-completed-btn" class="clear-completed-btn">
        Очистить выполненные
      </button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
